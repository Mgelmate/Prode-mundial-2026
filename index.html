<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prode Mundial 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --verde: #006847;
      --verde-claro: #00a65a;
      --dorado: #d4af37;
      --dorado-claro: #f0d060;
      --negro: #0d0d0d;
      --gris-oscuro: #1a1a2e;
      --gris-medio: #2d2d44;
      --texto-suave: #8888aa;
      --blanco: #ffffff;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--gris-oscuro);
      color: var(--blanco);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button { cursor: pointer; font-family: inherit; border: none; }
    .hidden { display: none !important; }

    /* LOGIN */
    #login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0,104,71,0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(212,175,55,0.15) 0%, transparent 50%),
        var(--gris-oscuro);
    }
    .login-card {
      background: var(--gris-medio);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 32px;
      width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(0,104,71,0.3);
    }
    .login-emblem { font-size: 56px; margin-bottom: 16px; display: block; }
    .login-title {
      font-size: 26px; font-weight: 900; letter-spacing: 0.12em;
      background: linear-gradient(135deg, var(--dorado), var(--dorado-claro));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 6px;
    }
    .login-sub { color: var(--texto-suave); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 32px; }
    
    .login-input {
      width: 100%; padding: 14px 16px; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: var(--blanco);
      font-size: 15px; outline: none; margin-bottom: 12px;
    }
    .login-input:focus { border-color: var(--verde-claro); }
    .login-input::placeholder { color: var(--texto-suave); }
    
    .auth-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .login-btn {
      flex: 1; padding: 14px;
      background: linear-gradient(135deg, var(--verde), var(--verde-claro));
      color: var(--blanco); border-radius: 8px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
    }
    .register-btn {
      flex: 1; padding: 14px;
      background: transparent; border: 1.5px solid rgba(255,255,255,0.2);
      color: var(--blanco); border-radius: 8px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.04em; transition: all 0.2s;
    }
    .register-btn:hover { border-color: var(--verde-claro); }
    
    .login-error { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; font-weight: 600; }
    .login-success { color: var(--verde-claro); font-size: 13px; margin-bottom: 12px; font-weight: 600; }

    /* HEADER */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    .app-header {
      background: var(--negro);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 900px; margin: 0 auto; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-title {
      font-size: 15px; font-weight: 900; letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--dorado), var(--dorado-claro));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: 9px; color: var(--texto-suave); letter-spacing: 0.08em; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-nav { display: flex; gap: 4px; }
    .nav-btn {
      padding: 7px 13px; border-radius: 20px; font-size: 13px; font-weight: 600;
      background: transparent; color: var(--texto-suave); transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: var(--blanco); }
    .nav-btn.active { background: var(--verde); color: var(--blanco); }
    .user-badge {
      width: 28px; height: 28px; background: var(--dorado); color: var(--negro);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; text-transform: uppercase;
    }
    .logout-btn { background: transparent; color: var(--texto-suave); font-size: 12px; padding: 4px 6px; }

    /* MAIN */
    .app-main { flex: 1; padding: 20px 16px 90px; max-width: 900px; margin: 0 auto; width: 100%; }

    /* LOADING */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 16px; color: var(--texto-suave); }
    .loading-ball { font-size: 40px; animation: spin 1.5s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* PANEL ADMIN */
    .admin-card { background: var(--gris-medio); border: 1px solid var(--dorado); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .admin-title { color: var(--dorado); font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .admin-desc { color: var(--texto-suave); font-size: 14px; margin-bottom: 20px; }
    .admin-action-btn { 
      width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700;
      background: linear-gradient(135deg, var(--dorado), var(--dorado-claro));
      color: var(--negro); margin-top: 10px; 
    }

    /* PROGRESO */
    .progreso-card { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; }
    .progreso-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .progreso-label { font-size: 12px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.05em; }
    .progreso-num { font-size: 14px; font-weight: 700; color: var(--dorado); }
    .progreso-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .progreso-fill { height: 100%; background: linear-gradient(90deg, var(--verde), var(--verde-claro)); border-radius: 3px; transition: width 0.4s ease; }

    /* TABS */
    .fase-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .fase-tab {
      padding: 7px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,0.05); color: var(--texto-suave);
      border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s;
    }
    .fase-tab.active { background: var(--verde); color: var(--blanco); border-color: var(--verde); }
    .grupo-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 18px; }
    .grupo-tab {
      width: 36px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,0.04); color: var(--texto-suave);
      border: 1px solid rgba(255,255,255,0.08); transition: all 0.15s;
    }
    .grupo-tab.active { background: var(--dorado); color: var(--negro); border-color: var(--dorado); }

    /* PARTIDO */
    .partidos-lista { display: flex; flex-direction: column; gap: 10px; }
    .partido-card {
      background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius); padding: 16px; transition: border-color 0.2s;
    }
    .partido-card.picked { border-color: rgba(0,166,90,0.4); }
    .partido-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--texto-suave); margin-bottom: 10px; display: block; }
    .partido-badge.fase { color: var(--dorado); }
    .partido-equipos { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .partido-equipo { font-size: 14px; font-weight: 700; flex: 1; }
    .partido-equipo.local { text-align: left; }
    .partido-equipo.visitante { text-align: right; }
    
    /* INPUTS GOLES */
    .partido-goles { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .goles-input {
      width: 48px; padding: 8px; border-radius: 8px; text-align: center;
      font-size: 16px; font-weight: 700; color: var(--blanco);
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      outline: none; transition: all 0.2s;
    }
    .goles-input:focus { border-color: var(--verde-claro); background: rgba(255,255,255,0.1); }
    .goles-input::-webkit-outer-spin-button,
    .goles-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .goles-input[type=number] { -moz-appearance: textfield; }
    .goles-guion { font-size: 14px; font-weight: 800; color: var(--texto-suave); }

    /* GUARDAR */
    .guardar-wrapper {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 16px;
      background: linear-gradient(transparent, var(--gris-oscuro) 30%);
      display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 50;
    }
    .guardar-btn {
      width: 100%; max-width: 500px; padding: 16px; border-radius: var(--radius);
      font-size: 15px; font-weight: 700;
      background: linear-gradient(135deg, var(--verde), var(--verde-claro));
      color: var(--blanco); box-shadow: 0 4px 20px rgba(0,104,71,0.4);
    }
    .guardar-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .guardar-btn.guardado { background: linear-gradient(135deg, #2d7a4f, #3da86e); }

    /* TABLA */
    .tabla-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .tabla-titulo { font-size: 22px; font-weight: 800; }
    .tabla-sub { font-size: 13px; color: var(--texto-suave); margin-top: 4px; }
    .refresh-btn {
      padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.07); color: var(--texto-suave);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tabla-vacia { text-align: center; padding: 60px 20px; color: var(--texto-suave); }
    .tabla-lista { display: flex; flex-direction: column; gap: 8px; }
    .tabla-row {
      background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius); padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .tabla-row.primero { border-color: rgba(212,175,55,0.5); background: rgba(212,175,55,0.06); }
    .tabla-row.segundo { border-color: rgba(192,192,192,0.3); }
    .tabla-row.tercero { border-color: rgba(205,127,50,0.3); }
    .tabla-pos { font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
    .tabla-info { flex: 1; min-width: 0; }
    .tabla-nombre { font-size: 15px; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabla-picks { font-size: 11px; color: var(--texto-suave); }
    .tabla-stats { text-align: right; flex-shrink: 0; }
    .tabla-puntos { font-size: 24px; font-weight: 900; color: var(--dorado); display: block; line-height: 1; }
    .tabla-puntos-label { font-size: 10px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.05em; }
    .tabla-update { text-align: center; font-size: 11px; color: var(--texto-suave); margin-top: 20px; }

    @media (max-width: 480px) {
      .header-inner { padding: 10px 12px; }
      .partido-equipo { font-size: 12px; }
    }
  </style>
</head>

        <button class="admin-action-btn" id="btn-sync-api" onclick="sincronizarAPI()">Sincronizar Resultados</button>
        <p id="api-status" style="margin-top: 15px; font-size: 13px; font-weight: 600; text-align: center;"></p>
      </div>

  </main>
</div>

<script>
// ─── SUPABASE ───────────────────────────────────────────────────────────────
const { createClient } = supabase
const db = createClient(
  'https://lmuvrsvxwllbwzjzohbl.supabase.co',
  'sb_publishable_AYSZK28_mYPab9CDz9eigA_amZDfBB7'
)

// ─── DATOS (GRUPOS OFICIALES MUNDIAL 2026) ──────────────────────────────────
const GRUPOS = {
  A: ['México','Sudáfrica','Corea del Sur','República Checa'],
  B: ['Canadá','Bosnia y Herzegovina','Catar','Suiza'],
  C: ['Brasil','Marruecos','Haití','Escocia'],
  D: ['Estados Unidos','Paraguay','Australia','Turquía'],
  E: ['Alemania','Curazao','Costa de Marfil','Ecuador'],

  G: ['Bélgica','Egipto','Irán','Nueva Zelanda'],
  H: ['España','Cabo Verde','Arabia Saudita','Uruguay'],
  I: ['Francia','Senegal','Irak','Noruega'],
  J: ['Argentina','Argelia','Austria','Jordania'],
  K: ['Portugal','RD Congo','Uzbekistán','Colombia'],
  L: ['Inglaterra','Croacia','Ghana','Panamá'],
}

const PARTIDOS_GRUPOS = Object.entries(GRUPOS).flatMap(([g, equipos]) => {
  const p = []
  for (let i = 0; i < equipos.length; i++)
    for (let j = i+1; j < equipos.length; j++)
      p.push({ id:`${g}${i}${j}`, fase:'Grupos', grupo:`Grupo ${g}`, local:equipos[i], visitante:equipos[j] })
  return p
})

const PARTIDOS_ELIM = [
  {id:'R32_1',fase:'Octavos',local:'1°A',visitante:'2°B'},{id:'R32_2',fase:'Octavos',local:'1°C',visitante:'2°D'},
  {id:'R32_3',fase:'Octavos',local:'1°E',visitante:'2°F'},{id:'R32_4',fase:'Octavos',local:'1°G',visitante:'2°H'},
  {id:'R32_5',fase:'Octavos',local:'1°I',visitante:'2°J'},{id:'R32_6',fase:'Octavos',local:'1°K',visitante:'2°L'},
  {id:'R32_7',fase:'Octavos',local:'2°A',visitante:'1°B'},{id:'R32_8',fase:'Octavos',local:'2°C',visitante:'1°D'},
  {id:'R32_9',fase:'Octavos',local:'2°E',visitante:'1°F'},{id:'R32_10',fase:'Octavos',local:'2°G',visitante:'1°H'},
  {id:'R32_11',fase:'Octavos',local:'2°I',visitante:'1°J'},{id:'R32_12',fase:'Octavos',local:'2°K',visitante:'1°L'},
  {id:'R32_13',fase:'Octavos',local:'3°ABCD',visitante:'3°EFGH'},{id:'R32_14',fase:'Octavos',local:'3°IJKL',visitante:'3°ABEF'},
  {id:'R32_15',fase:'Octavos',local:'3°CDIJ',visitante:'3°GHKL'},{id:'R32_16',fase:'Octavos',local:'3°ABCE',visitante:'3°DFGL'},
  {id:'QF_1',fase:'Cuartos',local:'W R32_1',visitante:'W R32_2'},{id:'QF_2',fase:'Cuartos',local:'W R32_3',visitante:'W R32_4'},
  {id:'QF_3',fase:'Cuartos',local:'W R32_5',visitante:'W R32_6'},{id:'QF_4',fase:'Cuartos',local:'W R32_7',visitante:'W R32_8'},
  {id:'QF_5',fase:'Cuartos',local:'W R32_9',visitante:'W R32_10'},{id:'QF_6',fase:'Cuartos',local:'W R32_11',visitante:'W R32_12'},
  {id:'QF_7',fase:'Cuartos',local:'W R32_13',visitante:'W R32_14'},{id:'QF_8',fase:'Cuartos',local:'W R32_15',visitante:'W R32_16'},
  {id:'SF_1',fase:'Semis',local:'W QF_1',visitante:'W QF_2'},{id:'SF_2',fase:'Semis',local:'W QF_3',visitante:'W QF_4'},
  {id:'SF_3',fase:'Semis',local:'W QF_5',visitante:'W QF_6'},{id:'SF_4',fase:'Semis',local:'W QF_7',visitante:'W QF_8'},
  {id:'TP',fase:'Tercer Puesto',local:'L SF_1',visitante:'L SF_2'},
  {id:'FINAL',fase:'Final',local:'W SF_1',visitante:'W SF_2'},
]

const TOTAL = PARTIDOS_GRUPOS.length + PARTIDOS_ELIM.length

// ─── ESTADO ──────────────────────────────────────────────────────────────────
let currentUser = null; 
let picks = {} 
let faseActiva = 'Grupos'
let grupoActivo = 'Grupo A'

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.onload = async () => {
  const { data: { session } } = await db.auth.getSession()
  if (session) {
    currentUser = session.user
    mostrarApp()
  }
}

// ─── LOGIN Y REGISTRO ─────────────────────────────────────────────────────────
async function handleAuth(action) {
  const email = document.getElementById('email-input').value.trim()
  const password = document.getElementById('pass-input').value
  const err = document.getElementById('login-error')
  
  err.className = 'login-error' 
  
  if (!email || password.length < 6) { 
    err.textContent = 'Ingresá un correo válido y una contraseña de al menos 6 caracteres.'; 
    err.classList.remove('hidden'); 
    return 
  }

  err.textContent = 'Procesando...';
  err.classList.remove('hidden');

  let result;
  if (action === 'register') {
    result = await db.auth.signUp({ email, password })
  } else {
    result = await db.auth.signInWithPassword({ email, password })
  }

  const { data, error } = result;

  if (error) {
    err.textContent = error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message
  } else {
    if (action === 'register') {
      err.textContent = '¡Cuenta creada con éxito! Entrando...'
      err.className = 'login-success'
    }
    currentUser = data.user
    setTimeout(mostrarApp, 1000)
  }
}

async function handleLogout() {
  await db.auth.signOut()
  currentUser = null; 
  picks = {}
  document.getElementById('app').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('pass-input').value = ''
}

function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none'
  const app = document.getElementById('app')
  app.style.display = 'flex'
  document.getElementById('user-badge').textContent = currentUser.email.charAt(0).toUpperCase()
  
  // 🔥 MODO SÚPER ADMIN ACTIVADO 🔥
  if (currentUser.id && currentUser.id.toLowerCase() === 'e16ed8fe-e586-45dc-a4bf-d43b6c56e416'.toLowerCase()) {
    if (!document.getElementById('btn-nav-admin')) {
      const nav = document.getElementById('main-nav');
      const adminBtn = document.createElement('button');
      adminBtn.className = 'nav-btn';
      adminBtn.id = 'btn-nav-admin';
      adminBtn.textContent = '⚙️ Admin';
      adminBtn.style.color = '#d4af37'; 
      adminBtn.onclick = () => mostrarVista('admin');
      nav.appendChild(adminBtn);

      // Recuperar token guardado localmente si existe
      const savedToken = localStorage.getItem('apiTokenProde');
      if(savedToken) document.getElementById('api-token-input').value = savedToken;
    }
  }
  
  cargarPicks()
}

// ─── NAVEGACIÓN ───────────────────────────────────────────────────────────────
function mostrarVista(vista) {
  document.getElementById('vista-prode').classList.toggle('hidden', vista !== 'prode')
  document.getElementById('vista-tabla').classList.toggle('hidden', vista !== 'tabla')
  document.getElementById('vista-admin').classList.toggle('hidden', vista !== 'admin')
  
  document.getElementById('btn-nav-prode').classList.toggle('active', vista === 'prode')
  document.getElementById('btn-nav-tabla').classList.toggle('active', vista === 'tabla')
  const btnAdmin = document.getElementById('btn-nav-admin');
  if(btnAdmin) btnAdmin.classList.toggle('active', vista === 'admin')

  if (vista === 'tabla') cargarTabla()
}

// ─── PICKS ────────────────────────────────────────────────────────────────────
async function cargarPicks() {
  document.getElementById('vista-prode').innerHTML = '<div class="loading"><div class="loading-ball">⚽</div><p>Cargando tus picks...</p></div>'
  const { data, error } = await db.from('picks').select('partido_id,resultado').eq('usuario', currentUser.email)
  if (!error) data.forEach(r => picks[r.partido_id] = r.resultado)
  renderProde()
}

function renderProde() {
  const completados = obtenerPicksCompletos().length
  const pct = Math.round((completados / TOTAL) * 100)

  const gruposUnicos = [...new Set(PARTIDOS_GRUPOS.map(p => p.grupo))].sort()
  const fases = ['Grupos','Octavos','Cuartos','Semis','Tercer Puesto','Final']

  const partidos = faseActiva === 'Grupos'
    ? PARTIDOS_GRUPOS.filter(p => p.grupo === grupoActivo)
    : PARTIDOS_ELIM.filter(p => p.fase === faseActiva)

  const grupoTabsHTML = faseActiva === 'Grupos' ? `
    <div class="grupo-tabs">
      ${gruposUnicos.map(g => `
        <button class="grupo-tab ${g === grupoActivo ? 'active' : ''}" onclick="setGrupo('${g}')">${g.replace('Grupo ','')}</button>
      `).join('')}
    </div>` : ''

  const partidosHTML = partidos.map(p => {
    const pickActual = picks[p.id] || ''
    const [pickLocal, pickVisitante] = pickActual.includes('-') ? pickActual.split('-') : ['', '']
    
    return `
      <div class="partido-card ${pickLocal !== '' && pickVisitante !== '' ? 'picked' : ''}" id="card-${p.id}">
        <span class="partido-badge ${p.grupo ? '' : 'fase'}">${p.grupo || p.fase}</span>
        <div class="partido-equipos">
          <span class="partido-equipo local">${p.local}</span>
          
          <div class="partido-goles">
            <input type="number" min="0" class="goles-input" placeholder="-" value="${pickLocal}" 
              oninput="setPickGoles('${p.id}', 'local', this.value)">
            <span class="goles-guion">-</span>
            <input type="number" min="0" class="goles-input" placeholder="-" value="${pickVisitante}" 
              oninput="setPickGoles('${p.id}', 'visitante', this.value)">
          </div>
          
          <span class="partido-equipo visitante">${p.visitante}</span>
        </div>
      </div>`
  }).join('')

  document.getElementById('vista-prode').innerHTML = `
    <div class="progreso-card">
      <div class="progreso-info">
        <span class="progreso-label">Tus picks</span>
        <span class="progreso-num" id="progreso-texto">${completados} / ${TOTAL}</span>
      </div>
      <div class="progreso-bar"><div class="progreso-fill" id="progreso-barra" style="width:${pct}%"></div></div>
    </div>
    <div class="fase-tabs">
      ${fases.map(f => `<button class="fase-tab ${f === faseActiva ? 'active' : ''}" onclick="setFase('${f}')">${f}</button>`).join('')}
    </div>
    ${grupoTabsHTML}
    <div class="partidos-lista">${partidosHTML}</div>
    <div class="guardar-wrapper">
      <p id="guardar-error" class="error-msg hidden"></p>
      <button class="guardar-btn" id="guardar-btn" onclick="guardarPicks()" ${completados === 0 ? 'disabled' : ''}>
        Guardar picks
      </button>
    </div>`
}

function setPickGoles(partidoId, lado, valor) {
  let [l, v] = (picks[partidoId] || '-').split('-');
  
  if (lado === 'local') l = valor;
  if (lado === 'visitante') v = valor;
  
  picks[partidoId] = `${l}-${v}`;

  const card = document.getElementById(`card-${partidoId}`);
  if (l !== '' && v !== '') {
    card.classList.add('picked');
  } else {
    card.classList.remove('picked');
  }
  
  actualizarProgreso();
}

function obtenerPicksCompletos() {
  return Object.entries(picks).filter(([_, res]) => {
    if (!res || !res.includes('-')) return false;
    const [l, v] = res.split('-');
    return l !== '' && v !== '';
  });
}

function actualizarProgreso() {
  const completados = obtenerPicksCompletos().length;
  const pct = Math.round((completados / TOTAL) * 100);
  document.getElementById('progreso-texto').textContent = `${completados} / ${TOTAL}`;
  document.getElementById('progreso-barra').style.width = `${pct}%`;
  document.getElementById('guardar-btn').disabled = completados === 0;
}

function setFase(fase) {
  faseActiva = fase
  renderProde()
}

function setGrupo(grupo) {
  grupoActivo = grupo
  renderProde()
}

async function guardarPicks() {
  const btn = document.getElementById('guardar-btn')
  const err = document.getElementById('guardar-error')
  btn.disabled = true
  btn.textContent = 'Guardando...'
  err.classList.add('hidden')

  const validPicks = obtenerPicksCompletos();
  const rows = validPicks.map(([partido_id, resultado]) => ({
    usuario: currentUser.email, partido_id, resultado, updated_at: new Date().toISOString()
  }))

  const { error } = await db.from('picks').upsert(rows, { onConflict: 'usuario,partido_id' })

  if (error) {
    err.textContent = 'Error al guardar. Intentá de nuevo.'
    err.classList.remove('hidden')
    btn.disabled = false
    btn.textContent = 'Guardar picks'
  } else {
    btn.classList.add('guardado')
    btn.textContent = '✓ Guardado'
    setTimeout(() => {
      btn.classList.remove('guardado')
      btn.textContent = 'Guardar picks'
      btn.disabled = false
    }, 3000)
  }
}

// ─── TABLA Y SISTEMA DE PUNTOS ────────────────────────────────────────────────
async function cargarTabla() {
  document.getElementById('vista-tabla').innerHTML = '<div class="loading"><div class="loading-ball">⚽</div><p>Cargando tabla...</p></div>'

  const [{ data: allPicks }, { data: resultados }] = await Promise.all([
    db.from('picks').select('usuario,partido_id,resultado'),
    db.from('resultados').select('partido_id,resultado')
  ])

  const mapRes = {}
  if (resultados) resultados.forEach(r => mapRes[r.partido_id] = r.resultado)

  const porUsuario = {}
  if (allPicks) allPicks.forEach(({ usuario: u, partido_id, resultado }) => {
    const apodo = u.split('@')[0]
    if (!porUsuario[apodo]) porUsuario[apodo] = {}
    porUsuario[apodo][partido_id] = resultado
  })

  const ranking = Object.entries(porUsuario).map(([u, userPicks]) => {
    let puntosTotales = 0;
    
    Object.entries(userPicks).forEach(([pid, resPick]) => {
      const resReal = mapRes[pid];
      if (resReal && resPick && resPick.includes('-') && resReal.includes('-')) {
        if (resPick === resReal) {
          puntosTotales += 3;
        } else {
          const [pickL, pickV] = resPick.split('-').map(Number);
          const [realL, realV] = resReal.split('-').map(Number);
          const tendPick = pickL > pickV ? 'L' : (pickL < pickV ? 'V' : 'E');
          const tendReal = realL > realV ? 'L' : (realL < realV ? 'V' : 'E');
          if (tendPick === tendReal) {
            puntosTotales += 1;
          }
        }
      }
    });

    return { usuario: u, puntos: puntosTotales, totalPicks: Object.keys(userPicks).length }
  }).sort((a, b) => b.puntos - a.puntos)

  const conResultado = Object.keys(mapRes).length
  const medallas = ['🥇','🥈','🥉']
  const clases = ['primero','segundo','tercero']

  const rowsHTML = ranking.length === 0
    ? '<div class="tabla-vacia"><p>🏟️ Todavía no hay picks cargados.</p></div>'
    : ranking.map((j, i) => `
        <div class="tabla-row ${clases[i] || ''}">
          <div class="tabla-pos">${medallas[i] || (i+1)}</div>
          <div class="tabla-info">
            <span class="tabla-nombre">${j.usuario}</span>
            <span class="tabla-picks">${j.totalPicks} picks cargados</span>
          </div>
          <div class="tabla-stats">
            <span class="tabla-puntos">${j.puntos}</span>
            <span class="tabla-puntos-label">puntos</span>
          </div>
        </div>`).join('')

  const now = new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' })

  document.getElementById('vista-tabla').innerHTML = `
    <div class="tabla-header">
      <div>
        <h2 class="tabla-titulo">Tabla de posiciones</h2>
        <p class="tabla-sub">${conResultado} partido${conResultado !== 1 ? 's' : ''} con resultado oficial</p>
      </div>
      <button class="refresh-btn" onclick="cargarTabla()">↻ Actualizar</button>
    </div>
    <div class="tabla-lista">${rowsHTML}</div>
    <p class="tabla-update">Actualizado: ${now}</p>`
}

// ─── API ADMIN SINC ───────────────────────────────────────────────────────────
async function sincronizarAPI() {
  const token = document.getElementById('api-token-input').value.trim();
  const statusEl = document.getElementById('api-status');
  
  if(!token) {
    statusEl.style.color = '#ff6b6b';
    statusEl.textContent = 'Por favor, ingresá un token primero.';
    return;
  }

  // Guardamos el token en tu teléfono para que no lo pierdas
  localStorage.setItem('apiTokenProde', token);
  
  statusEl.style.color = '#d4af37';
  statusEl.textContent = 'Conectando con la API... ⏳';

  try {
    // Acá armaremos la conexión real a la API. 
    // Por ahora validamos que el botón responda.
    setTimeout(() => {
      statusEl.style.color = '#00a65a';
      statusEl.textContent = '✅ ¡Sistema listo para consumir partidos oficiales!';
    }, 1500);
  } catch (error) {
    statusEl.style.color = '#ff6b6b';
    statusEl.textContent = 'Error de conexión. Revisá el token.';
  }
}
</script>
