<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prode Mundial 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --verde: #006847; --verde-claro: #00a65a;
      --dorado: #d4af37; --dorado-claro: #f0d060;
      --negro: #0d0d0d; --gris-oscuro: #1a1a2e; --gris-medio: #2d2d44;
      --texto-suave: #8888aa; --blanco: #ffffff; --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--gris-oscuro); color: var(--blanco); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    button { cursor: pointer; font-family: inherit; border: none; }
    .hidden { display: none !important; }

    /* LOGIN */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 20% 50%, rgba(0,104,71,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(212,175,55,0.15) 0%, transparent 50%), var(--gris-oscuro); }
    .login-card { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 48px 32px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 0 1px rgba(0,104,71,0.3); }
    .login-emblem { font-size: 56px; margin-bottom: 16px; display: block; }
    .login-title { font-size: 26px; font-weight: 900; letter-spacing: 0.12em; background: linear-gradient(135deg, var(--dorado), var(--dorado-claro)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
    .login-sub { color: var(--texto-suave); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: var(--blanco); font-size: 15px; outline: none; margin-bottom: 12px; }
    .login-input:focus { border-color: var(--verde-claro); }
    .auth-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .login-btn, .register-btn { flex: 1; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; }
    .login-btn { background: linear-gradient(135deg, var(--verde), var(--verde-claro)); color: var(--blanco); }
    .register-btn { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: var(--blanco); }
    .login-error, .login-success { font-size: 13px; margin-bottom: 12px; font-weight: 600; }
    .login-error { color: #ff6b6b; } .login-success { color: var(--verde-claro); }

    /* HEADER */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    .app-header { background: var(--negro); border-bottom: 1px solid rgba(255,255,255,0.07); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 900px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-title { font-size: 15px; font-weight: 900; letter-spacing: 0.1em; background: linear-gradient(135deg, var(--dorado), var(--dorado-claro)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-sub { font-size: 9px; color: var(--texto-suave); letter-spacing: 0.08em; text-transform: uppercase; }
    .header-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
    .nav-btn { padding: 7px 13px; border-radius: 20px; font-size: 13px; font-weight: 600; background: transparent; color: var(--texto-suave); white-space: nowrap; }
    .nav-btn.active { background: var(--verde); color: var(--blanco); }
    .user-badge { width: 28px; height: 28px; background: var(--dorado); color: var(--negro); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .logout-btn { background: transparent; color: var(--texto-suave); font-size: 12px; padding: 4px 6px; }

    /* MAIN */
    .app-main { flex: 1; padding: 20px 16px 90px; max-width: 900px; margin: 0 auto; width: 100%; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 16px; color: var(--texto-suave); }
    .loading-ball { font-size: 40px; animation: spin 1.5s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* LIGAS / TORNEOS */
    .ligas-card { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 20px; }
    .ligas-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: var(--dorado); }
    .ligas-desc { font-size: 14px; color: var(--texto-suave); margin-bottom: 24px; }
    .ligas-btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--verde), var(--verde-claro)); color: var(--blanco); font-weight: 700; border-radius: 8px; margin-bottom: 12px; }
    .ligas-btn-secondary { width: 100%; padding: 14px; background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: var(--blanco); font-weight: 700; border-radius: 8px; }
    .torneo-activo-box { border: 2px dashed var(--dorado); padding: 20px; border-radius: 12px; background: rgba(212,175,55,0.05); }
    .codigo-box { font-size: 24px; font-weight: 900; letter-spacing: 0.2em; color: var(--blanco); background: var(--negro); padding: 10px; border-radius: 8px; display: inline-block; margin: 10px 0; }

    /* ADMIN */
    .admin-card { background: var(--gris-medio); border: 1px solid var(--dorado); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .admin-action-btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700; background: linear-gradient(135deg, var(--dorado), var(--dorado-claro)); color: var(--negro); margin-top: 10px; }

    /* PROGRESO & PARTIDOS */
    .progreso-card { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; }
    .progreso-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--texto-suave); font-weight: 700;}
    .progreso-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .progreso-fill { height: 100%; background: linear-gradient(90deg, var(--verde), var(--verde-claro)); transition: width 0.4s ease; }
    .grupo-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 18px; }
    .grupo-tab { width: 36px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.04); color: var(--texto-suave); border: 1px solid rgba(255,255,255,0.08); }
    .grupo-tab.active { background: var(--dorado); color: var(--negro); border-color: var(--dorado); }
    
    .partidos-lista { display: flex; flex-direction: column; gap: 10px; }
    .partido-card { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius); padding: 16px; }
    .partido-card.picked { border-color: rgba(0,166,90,0.4); }
    .partido-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 10px; display: block; }
    .partido-equipos { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .partido-equipo { font-size: 14px; font-weight: 700; flex: 1; }
    .partido-equipo.local { text-align: left; } .partido-equipo.visitante { text-align: right; }
    .partido-goles { display: flex; align-items: center; gap: 10px; }
    .goles-input { width: 48px; padding: 8px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: 700; color: var(--blanco); background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.12); outline: none; }
    
    .guardar-wrapper { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(transparent, var(--gris-oscuro) 30%); display: flex; flex-direction: column; align-items: center; z-index: 50; }
    .guardar-btn { width: 100%; max-width: 500px; padding: 16px; border-radius: var(--radius); font-size: 15px; font-weight: 700; background: linear-gradient(135deg, var(--verde), var(--verde-claro)); color: var(--blanco); box-shadow: 0 4px 20px rgba(0,104,71,0.4); }

    /* TABLA */
    .tabla-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .tabla-titulo { font-size: 22px; font-weight: 800; }
    .tabla-sub { font-size: 13px; color: var(--texto-suave); margin-top: 4px; }
    .refresh-btn { padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.07); color: var(--texto-suave); border: 1px solid rgba(255,255,255,0.1); }
    .tabla-lista { display: flex; flex-direction: column; gap: 8px; }
    .tabla-row { background: var(--gris-medio); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .tabla-row.primero { border-color: rgba(212,175,55,0.5); background: rgba(212,175,55,0.06); }
    .tabla-pos { font-size: 18px; width: 32px; text-align: center; }
    .tabla-info { flex: 1; min-width: 0; }
    .tabla-nombre { font-size: 15px; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; }
    .tabla-puntos { font-size: 24px; font-weight: 900; color: var(--dorado); display: block; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <span class="login-emblem">⚽</span>
    <h1 class="login-title">PRODE MUNDIAL</h1>
    <input id="email-input" class="login-input" type="email" placeholder="Tu correo electrónico" />
    <input id="pass-input" class="login-input" type="password" placeholder="Contraseña (mínimo 6 caracteres)" />
    <p id="login-error" class="login-error hidden"></p>
    <div class="auth-buttons">
      <button class="login-btn" onclick="handleAuth('login')">Entrar</button>
      <button class="register-btn" onclick="handleAuth('register')">Registrarme</button>
    </div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span style="font-size:24px">🏆</span>
        <div><div class="header-title">PRODE MUNDIAL</div><div class="header-sub">2026</div></div>
      </div>
      <div class="header-right">
        <nav class="header-nav" id="main-nav">
          <button class="nav-btn active" id="btn-nav-prode" onclick="mostrarVista('prode')">Mi Prode</button>
          <button class="nav-btn" id="btn-nav-ligas" onclick="mostrarVista('ligas')">Torneos</button>
          <button class="nav-btn" id="btn-nav-tabla" onclick="mostrarVista('tabla')">Tabla</button>
        </nav>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="user-badge" id="user-badge"></div>
          <button class="logout-btn" onclick="handleLogout()">✕</button>
        </div>
      </div>
    </div>
  </header>
  <main class="app-main">
    
    <div id="vista-prode"></div>
    
    <div id="vista-ligas" class="hidden">
      <div id="ligas-no-activo" class="ligas-card">
        <h2 class="ligas-title">Torneos Privados</h2>
        <p class="ligas-desc">Creá un torneo para tu grupo de amigos o unite a uno existente con un código.</p>
        <button class="ligas-btn-primary" onclick="crearTorneo()">Crear Nuevo Torneo</button>
        <button class="ligas-btn-secondary" onclick="unirseTorneo()">Unirse con Código</button>
      </div>
      <div id="ligas-activo" class="ligas-card hidden">
        <div class="torneo-activo-box">
          <p style="color:var(--texto-suave); font-size:12px; text-transform:uppercase; font-weight:700;">Estás participando en:</p>
          <h2 class="ligas-title" id="nombre-torneo-display" style="margin: 10px 0;"></h2>
          <p style="font-size:14px; margin-top:15px;">Código para invitar a tus amigos:</p>
          <div class="codigo-box" id="codigo-torneo-display"></div>
        </div>
      </div>
    </div>

    <div id="vista-tabla" class="hidden"></div>
    
    <div id="vista-admin" class="hidden">
      <div class="admin-card">
        <h2 class="admin-title">⚙️ Panel de Súper Admin</h2>
        <p class="admin-desc">Conectá la API de football-data.org para automatizar resultados.</p>
        <input id="api-token-input" class="login-input" type="password" placeholder="Pegá tu API token acá..." />
        <button class="admin-action-btn" onclick="sincronizarAPI()">Sincronizar Resultados</button>
        <p id="api-status" style="margin-top:15px; font-size:13px; font-weight:600; text-align:center;"></p>
      </div>
    </div>

  </main>
</div>

<script>
// ─── SUPABASE ───────────────────────────────────────────────────────────────
const { createClient } = supabase
const db = createClient('https://lmuvrsvxwllbwzjzohbl.supabase.co', 'sb_publishable_AYSZK28_mYPab9CDz9eigA_amZDfBB7')

// ─── DATOS ──────────────────────────────────────────────────────────────────
const GRUPOS = {
  A: ['México','Sudáfrica','Corea del Sur','República Checa'], B: ['Canadá','Bosnia y Herzegovina','Catar','Suiza'],
  C: ['Brasil','Marruecos','Haití','Escocia'], D: ['Estados Unidos','Paraguay','Australia','Turquía'],
  E: ['Alemania','Curazao','Costa de Marfil','Ecuador'], F: ['Países Bajos','Japón','Suecia','Túnez'],
  G: ['Bélgica','Egipto','Irán','Nueva Zelanda'], H: ['España','Cabo Verde','Arabia Saudita','Uruguay'],
  I: ['Francia','Senegal','Irak','Noruega'], J: ['Argentina','Argelia','Austria','Jordania'],
  K: ['Portugal','RD Congo','Uzbekistán','Colombia'], L: ['Inglaterra','Croacia','Ghana','Panamá']
}
const PARTIDOS_GRUPOS = Object.entries(GRUPOS).flatMap(([g, eq]) => {
  const p = []; for(let i=0; i<eq.length; i++) for(let j=i+1; j<eq.length; j++) p.push({id:`${g}${i}${j}`, grupo:`Grupo ${g}`, local:eq[i], visitante:eq[j]}); return p;
})
const TOTAL = PARTIDOS_GRUPOS.length;

// ─── ESTADO ──────────────────────────────────────────────────────────────────
let currentUser = null; let picks = {}; let grupoActivo = 'Grupo A'; let torneoActivoId = null;

// ─── INIT & AUTH ─────────────────────────────────────────────────────────────
window.onload = async () => { const { data: { session } } = await db.auth.getSession(); if (session) { currentUser = session.user; mostrarApp(); } }

async function handleAuth(action) {
  const email = document.getElementById('email-input').value.trim(); const password = document.getElementById('pass-input').value;
  const err = document.getElementById('login-error'); err.className = 'login-error';
  if (!email || password.length < 6) { err.textContent = 'Datos inválidos.'; err.classList.remove('hidden'); return; }
  err.textContent = 'Cargando...'; err.classList.remove('hidden');
  const res = action === 'register' ? await db.auth.signUp({email, password}) : await db.auth.signInWithPassword({email, password});
  if (res.error) err.textContent = res.error.message; else { currentUser = res.data.user; mostrarApp(); }
}
async function handleLogout() { await db.auth.signOut(); location.reload(); }

// ─── APP PRINCIPAL ───────────────────────────────────────────────────────────
async function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none'; document.getElementById('app').style.display = 'flex';
  document.getElementById('user-badge').textContent = currentUser.email.charAt(0).toUpperCase();
  
  if (currentUser.id.toLowerCase() === 'e16ed8fe-e586-45dc-a4bf-d43b6c56e416'.toLowerCase() && !document.getElementById('btn-nav-admin')) {
    const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.id = 'btn-nav-admin'; btn.innerHTML = '⚙️ Admin'; btn.style.color = '#d4af37'; btn.onclick = () => mostrarVista('admin');
    document.getElementById('main-nav').appendChild(btn);
  }
  
  await cargarEstadoTorneo();
  cargarPicks();
}

function mostrarVista(vista) {
  ['prode','ligas','tabla','admin'].forEach(v => {
    const el = document.getElementById(`vista-${v}`); if(el) el.classList.toggle('hidden', v !== vista);
    const btn = document.getElementById(`btn-nav-${v}`); if(btn) btn.classList.toggle('active', v === vista);
  });
  if (vista === 'tabla') cargarTabla();
}

// ─── LIGAS (TORNEOS PRIVADOS) ────────────────────────────────────────────────
async function cargarEstadoTorneo() {
  const { data } = await db.from('usuarios_torneos').select('torneo_id').eq('usuario_email', currentUser.email).single();
  if (data) {
    torneoActivoId = data.torneo_id;
    const { data: liga } = await db.from('ligas').select('*').eq('id', torneoActivoId).single();
    if(liga) {
      document.getElementById('ligas-no-activo').classList.add('hidden');
      document.getElementById('ligas-activo').classList.remove('hidden');
      document.getElementById('nombre-torneo-display').textContent = liga.nombre_torneo;
      document.getElementById('codigo-torneo-display').textContent = liga.codigo_acceso;
    }
  }
}

async function crearTorneo() {
  const nombre = prompt('Ingresá el nombre para tu torneo de amigos:'); if(!nombre) return;
  const codigo = Math.random().toString(36).substring(2,8).toUpperCase();
  
  // 1. Crear en Ligas
  const { data: liga, error: errLiga } = await db.from('ligas').insert([{ nombre_torneo: nombre, codigo_acceso: codigo, admin_id: currentUser.id }]).select().single();
  if(errLiga) return alert('Error al crear el torneo. Intentá de nuevo.');
  
  // 2. Unir al usuario
  await db.from('usuarios_torneos').insert([{ usuario_email: currentUser.email, torneo_id: liga.id }]);
  alert(`¡Torneo creado! El código para invitar amigos es: ${codigo}`);
  cargarEstadoTorneo();
}

async function unirseTorneo() {
  const codigo = prompt('Ingresá el código de 6 letras que te pasó tu amigo:'); if(!codigo) return;
  const { data: liga } = await db.from('ligas').select('id').eq('codigo_acceso', codigo.toUpperCase()).single();
  if(!liga) return alert('Código inválido. Revisalo y volvé a intentar.');
  
  await db.from('usuarios_torneos').insert([{ usuario_email: currentUser.email, torneo_id: liga.id }]);
  alert('¡Te uniste al torneo exitosamente!');
  cargarEstadoTorneo();
}

// ─── PICKS ───────────────────────────────────────────────────────────────────
async function cargarPicks() {
  document.getElementById('vista-prode').innerHTML = '<div class="loading"><div class="loading-ball">⚽</div></div>';
  const { data } = await db.from('picks').select('partido_id,resultado').eq('usuario', currentUser.email);
  if (data) data.forEach(r => picks[r.partido_id] = r.resultado);
  renderProde();
}

function renderProde() {
  const completados = Object.keys(picks).filter(k => picks[k].includes('-') && !picks[k].startsWith('-') && !picks[k].endsWith('-')).length;
  const pct = Math.round((completados / TOTAL) * 100);
  const partidos = PARTIDOS_GRUPOS.filter(p => p.grupo === grupoActivo);
  const gruposUnicos = [...new Set(PARTIDOS_GRUPOS.map(p => p.grupo))].sort();

  const partidosHTML = partidos.map(p => {
    const [l, v] = (picks[p.id] || '').split('-');
    return `
      <div class="partido-card ${l && v ? 'picked' : ''}" id="card-${p.id}">
        <span class="partido-badge">${p.grupo}</span>
        <div class="partido-equipos">
          <span class="partido-equipo local">${p.local}</span>
          <div class="partido-goles"><input type="number" min="0" class="goles-input" value="${l||''}" oninput="setPick('${p.id}', 'local', this.value)"><span style="color:var(--texto-suave)">-</span><input type="number" min="0" class="goles-input" value="${v||''}" oninput="setPick('${p.id}', 'visitante', this.value)"></div>
          <span class="partido-equipo visitante">${p.visitante}</span>
        </div>
      </div>`
  }).join('');

  document.getElementById('vista-prode').innerHTML = `
    <div class="progreso-card"><div class="progreso-info"><span>Tus picks: ${completados} / ${TOTAL}</span></div><div class="progreso-bar"><div class="progreso-fill" style="width:${pct}%"></div></div></div>
    <div class="grupo-tabs">${gruposUnicos.map(g => `<button class="grupo-tab ${g===grupoActivo?'active':''}" onclick="grupoActivo='${g}'; renderProde()">${g.replace('Grupo ','')}</button>`).join('')}</div>
    <div class="partidos-lista" style="margin-bottom:80px;">${partidosHTML}</div>
    <div class="guardar-wrapper"><button class="guardar-btn" id="guardar-btn" onclick="guardarPicks()">Guardar picks</button></div>`
}

function setPick(id, lado, val) {
  let [l, v] = (picks[id] || '-').split('-'); lado === 'local' ? l = val : v = val; picks[id] = `${l}-${v}`;
  const c = document.getElementById(`card-${id}`); if(l!=='' && v!=='') c.classList.add('picked'); else c.classList.remove('picked');
}

async function guardarPicks() {
  const btn = document.getElementById('guardar-btn'); btn.textContent = 'Guardando...';
  const rows = Object.entries(picks).filter(([_, r]) => r.includes('-') && !r.startsWith('-') && !r.endsWith('-')).map(([partido_id, resultado]) => ({ usuario: currentUser.email, partido_id, resultado, updated_at: new Date().toISOString() }));
  await db.from('picks').upsert(rows, { onConflict: 'usuario,partido_id' });
  btn.textContent = '✓ Guardado'; setTimeout(() => btn.textContent = 'Guardar picks', 2000); renderProde();
}

// ─── TABLA PRIVADA ───────────────────────────────────────────────────────────
async function cargarTabla() {
  document.getElementById('vista-tabla').innerHTML = '<div class="loading"><div class="loading-ball">⚽</div><p>Calculando posiciones...</p></div>';
  
  if (!torneoActivoId) {
    document.getElementById('vista-tabla').innerHTML = '<div style="text-align:center; padding:40px 20px; color:var(--texto-suave);">Para ver la tabla, primero tenés que unirte o crear un torneo en la pestaña "Torneos".</div>';
    return;
  }

  // Obtenemos solo a los usuarios del mismo torneo
  const { data: compas } = await db.from('usuarios_torneos').select('usuario_email').eq('torneo_id', torneoActivoId);
  const emailsPermitidos = compas ? compas.map(c => c.usuario_email) : [];

  const [{ data: p }, { data: r }] = await Promise.all([
    db.from('picks').select('usuario,partido_id,resultado').in('usuario', emailsPermitidos), 
    db.from('resultados').select('partido_id,resultado')
  ]);

  const mapRes = {}; if(r) r.forEach(x => mapRes[x.partido_id] = x.resultado);
  const users = {}; 
  if(p) p.forEach(x => { 
    const u = x.usuario.split('@')[0]; if(!users[u]) users[u] = {puntos:0}; 
    if(mapRes[x.partido_id]) {
      if(x.resultado === mapRes[x.partido_id]) users[u].puntos += 3;
      else {
        const [pl, pv] = x.resultado.split('-').map(Number); const [rl, rv] = mapRes[x.partido_id].split('-').map(Number);
        if((pl>pv && rl>rv) || (pl<pv && rl<rv) || (pl===pv && rl===rv)) users[u].puntos += 1;
      }
    }
  });
  
  const rank = Object.entries(users).map(([u,d]) => ({u, ...d})).sort((a,b) => b.puntos - a.puntos);
  document.getElementById('vista-tabla').innerHTML = `
    <div class="tabla-header"><div><h2 class="tabla-titulo">Tabla de Posiciones</h2></div><button class="refresh-btn" onclick="cargarTabla()">↻ Update</button></div>
    <div class="tabla-lista">${rank.length === 0 ? '<p style="text-align:center;color:#888;">Nadie cargó resultados aún.</p>' : rank.map((j, i) => `<div class="tabla-row ${i===0?'primero':''}"><div class="tabla-pos">${i+1}</div><div class="tabla-info"><span class="tabla-nombre">${j.u}</span></div><div class="tabla-puntos">${j.puntos}</div></div>`).join('')}</div>`
}
