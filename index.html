<!DOCTYPE html>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--gris-oscuro);color:var(--blanco);min-height:100vh;-webkit-font-smoothing:antialiased;}

    input{font-family:inherit;}

    /* LOGIN */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;

                 radial-gradient(ellipse at 80% 20%,rgba(212,175,55,.15) 0%,transparent 50%),var(--gris-oscuro);}
    .login-card{background:var(--gris-medio);border:1px solid rgba(255,255,255,.08);border-radius:20px;

    .login-emblem{font-size:56px;margin-bottom:16px;display:block;}
    .login-title{font-size:26px;font-weight:900;letter-spacing:.12em;
      background:linear-gradient(135deg,var(--dorado),var(--dorado-claro));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
    .login-sub{color:var(--texto-suave);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px;}
    .puntos-chips{display:flex;justify-content:center;gap:10px;margin-bottom:24px;}
    .chip{background:rgba(0,104,71,.15);border:1px solid rgba(0,166,90,.2);border-radius:10px;padding:10px 14px;text-align:center;}
    .chip-num{font-size:18px;font-weight:900;color:var(--dorado);display:block;}
    .chip-label{font-size:9px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.04em;}
    .login-input{width:100%;padding:14px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);color:var(--blanco);font-size:15px;outline:none;margin-bottom:12px;}
    .login-input:focus{border-color:var(--verde-claro);}
    .login-input::placeholder{color:var(--texto-suave);}
    .auth-buttons{display:flex;gap:10px;margin-top:8px;}
    .login-btn,.register-btn{flex:1;padding:14px;border-radius:8px;font-size:14px;font-weight:700;}
    .login-btn{background:linear-gradient(135deg,var(--verde),var(--verde-claro));color:var(--blanco);}
    .register-btn{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:var(--blanco);}
    .login-error{color:#ff6b6b;font-size:13px;margin-bottom:12px;font-weight:600;}
    .login-success{color:var(--verde-claro);font-size:13px;margin-bottom:12px;font-weight:600;}

    #app{display:none;flex-direction:column;min-height:100vh;}
    .app-header{background:var(--negro);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:100;}
    .header-inner{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .header-brand{display:flex;align-items:center;gap:10px;}
    .header-title{font-size:15px;font-weight:900;letter-spacing:.1em;
      background:linear-gradient(135deg,var(--dorado),var(--dorado-claro));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .header-sub{font-size:9px;color:var(--texto-suave);letter-spacing:.08em;text-transform:uppercase;}
    .header-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;}
    .nav-btn{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;background:transparent;color:var(--texto-suave);white-space:nowrap;}
    .nav-btn.active{background:var(--verde);color:var(--blanco);}
    .user-badge{width:28px;height:28px;background:var(--dorado);color:var(--negro);border-radius:50%;

    .logout-btn{background:transparent;color:var(--texto-suave);font-size:12px;padding:4px 6px;}
    .app-main{flex:1;padding:20px 16px 90px;max-width:900px;margin:0 auto;width:100%;}

    .ligas-title{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--dorado);}
    .ligas-desc{font-size:14px;color:var(--texto-suave);margin-bottom:24px;line-height:1.5;}
    .ligas-btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--verde),var(--verde-claro));color:var(--blanco);font-weight:700;border-radius:8px;margin-bottom:12px;font-size:14px;}
    .ligas-btn-secondary{width:100%;padding:14px;background:transparent;border:1.5px solid rgba(255,255,255,.2);color:var(--blanco);font-weight:700;border-radius:8px;font-size:14px;}
    .torneo-activo-box{border:2px dashed var(--dorado);padding:20px;border-radius:12px;background:rgba(212,175,55,.05);}

    .grupo-tab.active{background:var(--dorado);color:var(--negro);border-color:var(--dorado);}

    .gol-input{width:46px;height:46px;border-radius:9px;text-align:center;font-size:20px;font-weight:900;

    .gol-input::-webkit-outer-spin-button,.gol-input::-webkit-inner-spin-button{-webkit-appearance:none;}
    .gol-input:focus{border-color:var(--verde-claro);background:rgba(0,166,90,.1);}
    .gol-input.filled{border-color:rgba(0,166,90,.5);}
    .marcador-guion{font-size:18px;font-weight:900;color:var(--texto-suave);}

    /* GUARDAR */
    .guardar-wrapper{position:fixed;bottom:0;left:0;right:0;padding:16px;

    .tabla-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
    .tabla-titulo{font-size:22px;font-weight:800;}
    .tabla-sub{font-size:13px;color:var(--texto-suave);margin-top:4px;}
    .refresh-btn{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;

    .puntos-leyenda{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .leyenda-item{display:flex;align-items:center;gap:5px;background:var(--gris-medio);border-radius:20px;padding:5px 11px;font-size:11px;}
    .leyenda-pts{font-weight:900;color:var(--dorado);font-size:13px;}
    .tabla-vacia{text-align:center;padding:50px 20px;color:var(--texto-suave);}
    .tabla-lista{display:flex;flex-direction:column;gap:8px;}
    .tabla-row{background:var(--gris-medio);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);

    .tabla-row.segundo{border-color:rgba(192,192,192,.3);}
    .tabla-row.tercero{border-color:rgba(205,127,50,.3);}
    .tabla-pos{font-size:18px;width:32px;text-align:center;flex-shrink:0;}
    .tabla-info{flex:1;min-width:0;}
    .tabla-nombre{font-size:15px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .tabla-detalle{font-size:10px;color:var(--texto-suave);margin-top:2px;}
    .tabla-pts{text-align:right;flex-shrink:0;}
    .tabla-pts-num{font-size:26px;font-weight:900;color:var(--dorado);display:block;line-height:1;}
    .tabla-pts-label{font-size:9px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.05em;}
    .tabla-update{text-align:center;font-size:11px;color:var(--texto-suave);margin-top:16px;}

    /* ADMIN */
    .admin-section{background:var(--gris-medio);border:1px solid rgba(212,175,55,.3);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
    .admin-title{font-size:15px;font-weight:800;color:var(--dorado);margin-bottom:4px;}
    .admin-sub{font-size:12px;color:var(--texto-suave);margin-bottom:14px;line-height:1.5;}
    .miembro-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
    .miembro-info{display:flex;align-items:center;gap:8px;}
    .miembro-avatar{width:28px;height:28px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
    .miembro-nombre{font-size:13px;font-weight:600;}
    .miembro-email{font-size:10px;color:var(--texto-suave);}
    .expulsar-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(231,76,60,.1);color:#ff8a80;border:1px solid rgba(231,76,60,.2);}

    .error-msg{color:#ff6b6b;font-size:12px;text-align:center;margin-bottom:7px;}
    @media(max-width:480px){.header-inner{padding:10px 12px;}.marcador-equipo{font-size:11px;}.gol-input{width:42px;height:42px;font-size:18px;}}
  </style>
</head>

  if(!email||pass.length<6){msg.textContent='Ingresá un correo válido y contraseña de al menos 6 caracteres.';return}
  const res = action==='register'
    ? await db.auth.signUp({email,password:pass})
    : await db.auth.signInWithPassword({email,password:pass})
  if(res.error){msg.textContent=res.error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':res.error.message}
  else{currentUser=res.data.user; msg.classList.add('hidden'); await mostrarApp()}
}

async function crearTorneo(){
  const nombre=document.getElementById('torneo-nombre').value.trim()
  const msg=document.getElementById('ligas-msg')
  if(nombre.length<3){mostrarMsg(msg,'El nombre necesita al menos 3 caracteres.','error');return}
  mostrarMsg(msg,'Creando torneo...','ok')

  // Generar código único
  let codigo, existe=true
  while(existe){
    codigo=Math.random().toString(36).slice(2,8).toUpperCase()
    const {data}=await db.from('ligas').select('id').eq('codigo_acceso',codigo).single()
    existe=!!data
  }

  // Insertar liga — admin_id = email del usuario
  const {data:liga, error} = await db.from('ligas').insert({
    nombre_torneo: nombre,
    codigo_acceso: codigo,
    admin_id: currentUser.email
  }).select('id, nombre_torneo, codigo_acceso, admin_id').single()

  if(error){mostrarMsg(msg,'Error al crear: '+error.message,'error');return}

  // Unir al creador (torneo_id es UUID)
  const {error: e2} = await db.from('usuarios_torneos').insert({
    usuario_email: currentUser.email,
    torneo_id: liga.id
  })
  if(e2){mostrarMsg(msg,'Error al unirse al torneo: '+e2.message,'error');return}

  torneoActivo=liga
  document.getElementById('header-liga-nombre').textContent=liga.nombre_torneo

  // Agregar botón admin
  if(!document.getElementById('btn-nav-admin')){
    const btn=document.createElement('button')
    btn.className='nav-btn'; btn.id='btn-nav-admin'; btn.innerHTML='⚙️'
    btn.onclick=()=>mostrarVista('admin')
    document.getElementById('main-nav').appendChild(btn)
  }

  renderLigas()
}

async function unirseATorneo(){
  const codigo=document.getElementById('torneo-codigo').value.trim().toUpperCase()
  const msg=document.getElementById('ligas-msg')
  if(codigo.length<4){mostrarMsg(msg,'Ingresá el código completo.','error');return}
  mostrarMsg(msg,'Buscando torneo...','ok')

  const {data:liga, error} = await db.from('ligas').select('*').eq('codigo_acceso',codigo).single()
  if(error||!liga){mostrarMsg(msg,'Código no encontrado. Verificá con quien te lo mandó.','error');return}

  const {error:e2} = await db.from('usuarios_torneos').insert({
    usuario_email: currentUser.email,
    torneo_id: liga.id
  })

  if(e2 && !e2.message.includes('duplicate')){mostrarMsg(msg,'Error al unirse: '+e2.message,'error');return}

  torneoActivo=liga
  document.getElementById('header-liga-nombre').textContent=liga.nombre_torneo
  renderLigas()
}

function renderProde(){
  const completados=picksCompletos()
  const pct=Math.round((completados/TOTAL)*100)
  const fases=['Grupos','Octavos','Cuartos','Semis','Tercer Puesto','Final']
  const partidos=faseActiva==='Grupos'
    ?PARTIDOS_GRUPOS.filter(p=>p.grupo===grupoActivo)
    :PARTIDOS_ELIM.filter(p=>p.fase===faseActiva)
  const gruposUnicos=[...new Set(PARTIDOS_GRUPOS.map(p=>p.grupo))].sort()

  const grupoTabsHTML=faseActiva==='Grupos'?`
    <div class="grupo-tabs">
      ${gruposUnicos.map(g=>`<button class="grupo-tab ${g===grupoActivo?'active':''}" onclick="setGrupo('${g}')">${g.replace('Grupo ','')}</button>`).join('')}
    </div>`:''

  const partidosHTML=partidos.map(p=>{
    const pick=picks[p.id]||''
    const [gl,gv]=pick.includes('-')?pick.split('-'):['','']
    const bloqueado=estaPartidoBloqueado(p.id)
    return `
    <div class="partido-card ${pick&&gl!==''&&gv!==''?'picked':''} ${bloqueado?'bloqueado':''}" id="card-${p.id}">
      <div class="partido-badge ${p.grupo?'':'fase-elim'}">
        <span>${p.grupo||p.fase}</span>
        ${bloqueado?'<span class="badge-lock">🔒 Cerrado</span>':''}
      </div>
      <div class="marcador-row">
        <span class="marcador-equipo local">${p.local}</span>
        <div class="marcador-inputs">
          <input class="gol-input ${gl!==''?'filled':''}" type="number" min="0" max="20"
            value="${gl}" placeholder="0" id="gl-${p.id}"
            oninput="actualizarPick('${p.id}')" ${bloqueado?'disabled':''}/>
          <span class="marcador-guion">—</span>
          <input class="gol-input ${gv!==''?'filled':''}" type="number" min="0" max="20"
            value="${gv}" placeholder="0" id="gv-${p.id}"
            oninput="actualizarPick('${p.id}')" ${bloqueado?'disabled':''}/>
        </div>
        <span class="marcador-equipo visitante">${p.visitante}</span>
      </div>
    </div>`
  }).join('')

  document.getElementById('vista-prode').innerHTML=`
    <div class="progreso-card">
      <div class="progreso-info">
        <span class="progreso-label">Partidos completados</span>
        <span class="progreso-num" id="prog-txt">${completados} / ${TOTAL}</span>
      </div>
      <div class="progreso-bar"><div class="progreso-fill" id="prog-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="fase-tabs">${fases.map(f=>`<button class="fase-tab ${f===faseActiva?'active':''}" onclick="setFase('${f}')">${f}</button>`).join('')}</div>
    ${grupoTabsHTML}
    <div class="partidos-lista">${partidosHTML}</div>
    <div class="guardar-wrapper">
      <p id="guardar-error" class="error-msg hidden"></p>
      <button class="guardar-btn" id="guardar-btn" onclick="guardarPicks()" ${completados===0?'disabled':''}>Guardar picks</button>
    </div>`
}

function actualizarPick(id){
  const gl=document.getElementById('gl-'+id)?.value??''
  const gv=document.getElementById('gv-'+id)?.value??''
  if(gl!==''&&gv!='') picks[id]=`${gl}-${gv}`; else delete picks[id]
  const card=document.getElementById('card-'+id)
  if(card) card.classList.toggle('picked',!!picks[id])
  const c=picksCompletos()
  const pt=document.getElementById('prog-txt'); if(pt) pt.textContent=`${c} / ${TOTAL}`
  const pb=document.getElementById('prog-bar'); if(pb) pb.style.width=`${Math.round(c/TOTAL*100)}%`
  const btn=document.getElementById('guardar-btn'); if(btn) btn.disabled=c===0
}

function picksCompletos(){
  return Object.values(picks).filter(r=>r&&r.includes('-')&&r.split('-').every(v=>v!=='')).length
}

function setFase(f){faseActiva=f;renderProde()}

async function guardarPicks(){

  const rows=Object.entries(picks).filter(([_,r])=>r&&r.includes('-')&&r.split('-').every(v=>v!=='')).map(([pid,res])=>({
    usuario_email: currentUser.email,

  if(error){err.textContent='Error al guardar: '+error.message;err.classList.remove('hidden');btn.disabled=false;btn.textContent='Guardar picks'}

async function cargarTabla(){
  const el=document.getElementById('vista-tabla')
  if(!torneoActivo){
    el.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--texto-suave)"><p style="font-size:40px;margin-bottom:16px">🏟️</p><p>Para ver la tabla tenés que estar en un torneo.</p><p style="margin-top:8px"><button onclick="mostrarVista(\'ligas\')" style="color:var(--verde-claro);background:none;border:none;font-weight:700;font-size:14px">Ir a Torneos →</button></p></div>'
    return
  }
  el.innerHTML='<div class="loading"><div class="loading-ball">⚽</div><p>Calculando posiciones...</p></div>'

  const [{data:allPicks},{data:resultados},{data:miembros}]=await Promise.all([
    db.from('picks').select('usuario_email,partido_id,resultado').eq('liga_id',torneoActivo.id),
    db.from('resultados').select('partido_id,resultado'),
    db.from('usuarios_torneos').select('usuario_email').eq('torneo_id',torneoActivo.id)
  ])

  const mapRes={};if(resultados) resultados.forEach(r=>mapRes[r.partido_id]=r.resultado)
  const emailsMiembros=new Set((miembros||[]).map(m=>m.usuario_email))

  const porUsuario={}
  if(allPicks) allPicks.filter(p=>emailsMiembros.has(p.usuario_email)).forEach(({usuario_email:u,partido_id,resultado})=>{
    if(!porUsuario[u]) porUsuario[u]={}; porUsuario[u][partido_id]=resultado
  })

  const ranking=Object.entries(porUsuario).map(([email,up])=>{
    let pts=0,exactos=0,ganadores=0
    Object.entries(up).forEach(([pid,pick])=>{
      const real=mapRes[pid]
      if(!real||!pick||!pick.includes('-')||!real.includes('-')) return
      if(pick===real){pts+=3;exactos++}
      else{
        const [pl,pv]=pick.split('-').map(Number),[rl,rv]=real.split('-').map(Number)
        const tp=pl>pv?'L':pv>pl?'V':'E', tr=rl>rv?'L':rv>rl?'V':'E'
        if(tp===tr){pts+=1;ganadores++}
      }
    })
    return{email,nombre:email.split('@')[0],pts,exactos,ganadores,totalPicks:Object.keys(up).length}
  }).sort((a,b)=>b.pts-a.pts||b.exactos-a.exactos)

  const conResultado=Object.keys(mapRes).length
  const medallas=['🥇','🥈','🥉'],clases=['primero','segundo','tercero']
  const rowsHTML=ranking.length===0
    ?'<div class="tabla-vacia"><p>🏟️ Nadie cargó picks todavía.</p></div>'
    :ranking.map((j,i)=>`
      <div class="tabla-row ${clases[i]||''}">
        <div class="tabla-pos">${medallas[i]||(i+1)}</div>
        <div class="tabla-info">
          <span class="tabla-nombre">${j.nombre}</span>
          <span class="tabla-detalle">✅ ${j.exactos} exactos · 👍 ${j.ganadores} ganadores · ${j.totalPicks} picks</span>
        </div>
        <div class="tabla-pts"><span class="tabla-pts-num">${j.pts}</span><span class="tabla-pts-label">pts</span></div>
      </div>`).join('')

  const now=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
  el.innerHTML=`
    <div class="tabla-header">
      <div><h2 class="tabla-titulo">${torneoActivo.nombre_torneo}</h2><p class="tabla-sub">${conResultado} partido${conResultado!==1?'s':''} con resultado oficial</p></div>
      <button class="refresh-btn" onclick="cargarTabla()">↻</button>
    </div>
    <div class="puntos-leyenda">
      <div class="leyenda-item"><span class="leyenda-pts">3</span> Exacto</div>
      <div class="leyenda-item"><span class="leyenda-pts">1</span> Ganador</div>
      <div class="leyenda-item"><span class="leyenda-pts">0</span> Error</div>
    </div>
    <div class="tabla-lista">${rowsHTML}</div>
    <p class="tabla-update">Actualizado: ${now}</p>`
}

// ── RESULTADOS AUTOMÁTICOS ────────────────────────────────────────────────────
async function cargarResultadosOficiales(){
  const {data}=await db.from('resultados').select('partido_id,resultado,fecha_inicio,estado')
  if(data) data.forEach(r=>{resultadosOficiales[r.partido_id]={resultado:r.resultado,fecha:r.fecha_inicio,estado:r.estado}})
  const token=localStorage.getItem('fd_token')
  if(token) sincronizarDesdeAPI(token)
}

async function sincronizarDesdeAPI(token){
  try{
    const res=await fetch('https://api.football-data.org/v4/competitions/WC/matches?season=2026',{headers:{'X-Auth-Token':token}})
    if(!res.ok) return
    const json=await res.json()
    const upserts=[]
    for(const match of (json.matches||[])){
      const pid=mapearPartidoAPI(match)
      if(!pid) continue
      resultadosOficiales[pid]={resultado:null,estado:match.status,fecha:match.utcDate}
      if(match.status==='FINISHED'&&match.score?.fullTime){
        const r=`${match.score.fullTime.home}-${match.score.fullTime.away}`
        upserts.push({partido_id:pid,resultado:r,estado:'FINISHED',fecha_inicio:match.utcDate,updated_at:new Date().toISOString()})
        resultadosOficiales[pid].resultado=r
      }
    }
    if(upserts.length>0) await db.from('resultados').upsert(upserts,{onConflict:'partido_id'})
  }catch(e){console.log('API sync:',e)}
}

function estaPartidoBloqueado(partidoId){
  const r=resultadosOficiales[partidoId]
  if(!r||!r.fecha) return false
  return new Date()>=new Date(r.fecha)
}

// ── NAVEGACIÓN ────────────────────────────────────────────────────────────────
function mostrarVista(vista){
  ['prode','ligas','tabla','admin'].forEach(v=>{
    const el=document.getElementById('vista-'+v); if(el) el.classList.toggle('hidden',v!==vista)
    const btn=document.getElementById('btn-nav-'+v); if(btn) btn.classList.toggle('active',v===vista)
  })
  if(vista==='tabla') cargarTabla()
  if(vista==='admin') cargarAdmin()
  if(vista==='ligas') renderLigas()
}
